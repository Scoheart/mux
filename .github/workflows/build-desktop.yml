name: Build desktop (macOS dmg)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Existing vX.Y.Z tag to retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.stable_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-dmg:
    name: Build and publish
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_tag || github.ref_name }}
    steps:
      - name: Validate stable release trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "stable release requires a vX.Y.Z tag" >&2
            exit 1
          }

      - name: Checkout release tag
        # actions/checkout v5.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify immutable tag and Draft provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$source_sha"
          expected_version=$(tr -d '[:space:]' <version.txt)
          test "$RELEASE_TAG" = "v$expected_version"
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          draft_matches=$(jq -r --arg tag "$RELEASE_TAG" --arg sha "$source_sha" '
            [.[][] | select(
              .tag_name == $tag and
              .target_commitish == $sha and
              .draft == true and
              .prerelease == false
            )] | length
          ' <<<"$releases")
          test "$draft_matches" = 1
          echo "sha=$source_sha" >>"$GITHUB_OUTPUT"

      - name: Checkout retry delivery helpers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # actions/checkout v5.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .delivery
          sparse-checkout: .github/scripts

      - name: Setup Node
        # actions/setup-node v5.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        # dtolnay/rust-toolchain stable at implementation time
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust build
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            desktop/src-tauri -> target
            . -> target
          cache-on-failure: true

      - name: Check release version metadata
        run: node scripts/release-version.mjs check --tag "$RELEASE_TAG"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build .dmg
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run tauri build -- --bundles app,dmg -- --locked

      - name: Verify macOS release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          DMG=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$APP"
          test -n "$DMG"

          EXPECTED=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          test "$RELEASE_TAG" = "v$EXPECTED"

          verify_app() {
            local app=$1 actual
            test -d "$app"
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
            test "$actual" = "$EXPECTED"
            test "$("$app/Contents/MacOS/mux" --version)" = "mux $EXPECTED"
            codesign --verify --deep --strict --verbose=2 "$app"
          }

          verify_app "$APP"
          hdiutil verify "$DMG"

          MOUNT=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MOUNT" >/dev/null 2>&1 || true
            rmdir "$MOUNT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$MOUNT" "$DMG"
          PACKAGED_APP=$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$PACKAGED_APP"
          verify_app "$PACKAGED_APP"
          cleanup
          trap - EXIT

      - name: Package CLI
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          CLI=target/release/mux
          EXPECTED=$(tr -d '[:space:]' <version.txt)
          test -x "$CLI"
          test "$("$CLI" --version)" = "mux $EXPECTED"
          case "$(uname -m)" in
            arm64|aarch64) TRIPLE=aarch64-apple-darwin ;;
            x86_64) TRIPLE=x86_64-apple-darwin ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          OUT="mux_${RELEASE_TAG}_${TRIPLE}.tar.gz"
          tar -C target/release -czf "$OUT" mux
          echo "path=$OUT" >>"$GITHUB_OUTPUT"

      - name: Name desktop installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          case "$(uname -m)" in
            arm64|aarch64) ARCH_LABEL=Apple-Silicon ;;
            x86_64) ARCH_LABEL=Intel ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          DEST="desktop/src-tauri/target/release/bundle/dmg/MUX-Desktop-Installer-${RELEASE_TAG}-macOS-${ARCH_LABEL}.dmg"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >>"$GITHUB_OUTPUT"

      - name: Package updater payload and manifest
        id: updater
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) ARCH=aarch64; ARCH_LABEL=Apple-Silicon ;;
            x86_64) ARCH=x86_64; ARCH_LABEL=Intel ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          TAR=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          test -n "$TAR"
          test -s "${TAR}.sig"
          SIG=$(cat "${TAR}.sig")
          VER=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          ASSET="MUX-Desktop-AutoUpdate-${RELEASE_TAG}-macOS-${ARCH_LABEL}.app.tar.gz"
          cp "$TAR" "$ASSET"
          PUB_DATE=$(git show -s --format=%cI "${{ steps.source.outputs.sha }}")
          cat >latest.json <<EOF
          {
            "version": "${VER}",
            "notes": "MUX ${RELEASE_TAG} — https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-${ARCH}": {
                "signature": "${SIG}",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}"
              }
            }
          }
          EOF
          jq -e . latest.json >/dev/null
          echo "asset=$ASSET" >>"$GITHUB_OUTPUT"

      - name: Complete and publish stable Draft
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.installer.outputs.path }}
          CLI_ARCHIVE: ${{ steps.cli.outputs.path }}
          UPDATER: ${{ steps.updater.outputs.asset }}
        run: |
          PUBLISHER=.github/scripts/publish-release-assets.sh
          if [[ -f .delivery/.github/scripts/publish-release-assets.sh ]]; then
            PUBLISHER=.delivery/.github/scripts/publish-release-assets.sh
          fi
          bash "$PUBLISHER" \
            "$RELEASE_TAG" "$INSTALLER" "$CLI_ARCHIVE" "$UPDATER" latest.json
