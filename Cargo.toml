[workspace]
resolver = "2"
members = ["core", "cli"]
exclude = ["desktop"]

# Match the desktop release profile. MUX is an I/O-bound configuration manager,
# so extra optimizer work has no user-visible benefit; the faster profile cut a
# clean local mux-cli release build by about 14%.
[profile.release]
codegen-units = 256
opt-level = 2
strip = true
